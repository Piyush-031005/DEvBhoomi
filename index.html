<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEVBHOOMI | The Land of the Gods</title>
    <meta name="description" content="An immersive cinematic journey through Uttarakhand — the Land of the Gods. Mountains, rivers, temples, and the soul of the Himalayas.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,700;0,900;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="canvas-container"></div>
    
    <!-- Hero Title: Brutalist Mask Scene -->
    <div class="fixed-overlay hero-brutalist" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; z-index: 100; pointer-events: none;">
      <div class="hero-grid-bg"></div>
      <div class="hero-title-container" id="devbhoomi-title">
        <h1 class="hero-br-title">
          <span class="br-hero-word">DEV</span>
          <span class="br-hero-word outline">BHOOMI</span>
          <span class="br-hero-word">WHERE</span>
          <span class="br-hero-word outline">GODS DWELL</span>
        </h1>
        <div class="hero-br-japanese">
          <span>神</span>
          <span>々</span>
          <span>の</span>
          <span>地</span>
        </div>
      </div>
    </div>

    <!-- ============================================================ -->
    <!-- BRUTALIST UI SHELL — Fixed overlay for the editorial phase   -->
    <!-- ============================================================ -->
    <div class="br-shell" id="br-shell">

      <!-- Top bar: title + chapter counter -->
      <div class="br-topbar">
        <span class="br-topbar-brand">DEVBHOOMI</span>
        <div class="br-topbar-right">
          <span class="br-topbar-label">UTTARAKHAND</span>
          <span class="br-topbar-label">INDIA</span>
          <span class="br-topbar-label" id="br-chapter-counter">01 / 04</span>
        </div>
      </div>

      <!-- Bottom bar: date, design credit, region -->
      <div class="br-bottombar">
        <span class="br-bottombar-item">30°22'N 78°04'E</span>
        <span class="br-bottombar-item">DEVBHOOMI — INTERACTIVE FILM</span>
        <span class="br-bottombar-item">2026</span>
      </div>

      <!-- Vertical chapter progress rail (right side) -->
      <div class="br-progress-rail">
        <div class="br-progress-tick active" data-ch="01">01</div>
        <div class="br-progress-tick" data-ch="02">02</div>
        <div class="br-progress-tick" data-ch="03">03</div>
        <div class="br-progress-tick" data-ch="04">04</div>
      </div>

      <!-- Red decorative horizontal accent lines -->
      <div class="br-accent-line top"></div>
      <div class="br-accent-line bottom"></div>

    </div>
    <!-- END BRUTALIST SHELL -->

    <main id="app">
      <!-- Act 1: The Void -->
      <section class="act-section" id="act-1" style="height: 30vh;"></section>

      <!-- Act 2: The Himalaya -->
      <section class="act-section" id="act-2" style="height: 120vh;"></section>

      <!-- Act 3: Birds -->
      <section class="act-section" id="act-3" style="height: 150vh;"></section>

      <!-- Act 4: transition buffer -->
      <section class="act-section" id="act-4" style="height: 50vh;"></section>

      </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
