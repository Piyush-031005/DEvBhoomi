<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEVBHOOMI | The Spiritual Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="canvas-container"></div>
    
    <div class="fixed-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; z-index: 1; pointer-events: none;">
      <h1 class="hero-title" id="devbhoomi-title">देवभूमी</h1>
    </div>

    <main id="app">
      <!-- Act 1: The Void -->
      <section class="act-section" id="act-1" style="height: 30vh;"></section>

      <!-- Act 2: The Himalaya -->
      <section class="act-section" id="act-2" style="height: 120vh;">
      </section>

      <!-- Act 3: Birds -->
      <section class="act-section" id="act-3" style="height: 150vh;">
      </section>

      <!-- Act 4: Sacred -->
      <section class="act-section" id="act-4" style="height: 100vh;">
      </section>

      <!-- Act 5: Brutalism x Uttarakhand -->
      <section class="act-section brutalist-section" id="brutalist-act" style="height: 300vh; position: relative;">
        <!-- The WebGL canvas (already fixed position) will render behind/intertwined with this HTML -->
        <div class="brutalist-content">
           <h1 class="brutalist-title glitch-text" data-text="DEV">DEV</h1>
           <h1 class="brutalist-title glitch-text outline" data-text="BHOOMI">BHOOMI</h1>
           <div class="brutalist-description">
              <p>THE LAND OF THE GODS</p>
              <p>REIMAGINED</p>
           </div>
        </div>
      </section>

    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
